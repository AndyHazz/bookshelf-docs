# Builds the site and publishes it to GitHub Pages.
# Needs Settings > Pages > Source: GitHub Actions.
name: docs
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict -d site
      # the guide as an EPUB, published beside the site (Calibre's ebook-convert)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends calibre
      - run: python tools/build_epub.py site site/bookshelf-guide.epub
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
