site_name: Bookshelf
site_description: A friendly home screen for KOReader. Your books on a shelf, the way you like them.
site_url: https://andyhazz.github.io/bookshelf-docs/
repo_url: https://github.com/AndyHazz/bookshelf.koplugin
repo_name: GitHub
edit_uri: ""
copyright: Bookshelf is free software (AGPL-3.0). These pages are <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, except theme pack artwork. Demo library from Standard Ebooks (CC0).

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo-mark.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: bs/moon
        name: Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: bs/sun
        name: Light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - toc.follow
    # no content.tooltips: Material's tooltips can't be dismissed with Escape
    # and vanish when the pointer moves onto them (WCAG 1.4.13); plain
    # browser titles are fine
    - content.code.copy
  icon:
    repo: fontawesome/brands/github
    search: bs/search

hooks:
  - hooks/clips.py
  - hooks/repo_facts.py

extra_css:
  - stylesheets/bookshelf.css
extra_javascript:
  - javascripts/clips.js
  - javascripts/tabs.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - abbr
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Install KOReader: get-started/koreader.md
      - Install Bookshelf: get-started/install.md
      - Your home folder: get-started/home-folder.md
      - Open on startup: get-started/startup.md
      - Your first five minutes: get-started/first-steps.md
      - Coming from KOReader: get-started/from-koreader.md
  - Use your shelf:
      - use/index.md
      - Covers, lists and spines: use/shelf-styles.md
      - Moving around: use/navigation.md
      - Opening and managing books: use/book-menu.md
      - Search: use/search.md
      - The start menu: use/start-menu.md
  - Organise:
      - organise/index.md
      - Shelves: organise/shelves.md
      - Sources, filters and sorting: organise/sources-filters.md
      - Series, authors and genres: organise/groups.md
      - Folders: organise/folders.md
      - Collections and tags: organise/collections.md
      - Page counts: organise/page-counts.md
      - Calibre, Kindle and Kobo libraries: organise/other-libraries.md
      - Online catalogues (OPDS): organise/opds.md
      - Hardcover: organise/hardcover.md
  - Make it yours:
      - customise/index.md
      - Themes: customise/themes.md
      - Wallpaper and colours: customise/wallpaper-colours.md
      - Ornaments: customise/ornaments.md
      - Theme packs: customise/packs.md
      - The top panel: customise/top-panel.md
      - Micro-modules: customise/micro-modules.md
      - Layout, fonts and animations: customise/layout.md
  - Reference:
      - reference/index.md
      - Every menu option: reference/menus.md
      - Gestures: reference/gestures.md
      - Tokens: reference/tokens.md
      - Troubleshooting: reference/troubleshooting.md
      - Updating: reference/updating.md
      - Files, backup and removing: reference/files.md
      - "What's new": reference/whats-new.md
      - For plugin authors: reference/plugin-authors.md
      - How Bookshelf is made: reference/how-its-made.md

