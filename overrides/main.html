{% extends "base.html" %}

{% block extrahead %}
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@800&family=Roboto+Condensed:wght@400;600;700&display=swap">
  {% set image = config.site_url ~ "assets/social.png" %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page and page.title and not page.is_homepage %}{{ page.title }} - {% endif %}{{ config.site_name }}">
  <meta property="og:description" content="{{ (page and page.meta and page.meta.description) or config.site_description }}">
  <meta property="og:image" content="{{ image }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ image }}">
  <link rel="alternate icon" type="image/png" href="{{ 'assets/favicon.png' | url }}">
{% endblock %}


{% block scripts %}
  {{ super() }}
  <script src="https://storage.ko-fi.com/cdn/scripts/overlay-widget.js"></script>
  <script>
    // Draw the Ko-fi button once. Material's instant navigation swaps pages
    // without a reload and runs this again, which drew a fresh (broken) copy
    // of the widget on every page visited.
    if (!window.__bsKofiDrawn && window.kofiWidgetOverlay) {
      window.__bsKofiDrawn = true;
      kofiWidgetOverlay.draw('andyhazz', {
        'type': 'floating-chat',
        'floating-chat.donateButton.text': 'Leave a tip',
        'floating-chat.donateButton.background-color': '#ff38b8',
        'floating-chat.donateButton.text-color': '#fff'
      });
    }
  </script>
{% endblock %}
